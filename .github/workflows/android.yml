name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY_B64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEY_B64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_SIGNING_KEY_B64 and ANDROID_SIGNING_PASSWORD in the repository's Actions secrets before building an updateable APK."
            exit 1
          fi
          umask 077
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/republic-reconcile.jks"
          keytool -list -keystore "$RUNNER_TEMP/republic-reconcile.jks" -storepass "$KEY_PASSWORD" -alias republic-reconcile >/dev/null
          echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/republic-reconcile.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          # Never embed the Yahoo app password inside an APK.
          YAHOO_EMAIL: ${{ vars.YAHOO_EMAIL }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Republic-Reconcile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
